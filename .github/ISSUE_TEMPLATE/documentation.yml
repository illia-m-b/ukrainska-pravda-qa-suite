---
# yamllint disable rule:line-length
name: Documentation
description: Propose documentation improvements or corrections (SRS, Test Plan, Test Cases, README).
title: 'docs: '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        ### Accurate, Concise Documentation
        Propose corrections or additions to test documentation or setup guides.
  - type: textarea
    id: target
    attributes:
      label: Target Documentation
      description: Document or section to improve.
      placeholder: README.md, CONTRIBUTING.md.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Proposed Changes
      description: Explain what is missing, outdated, or inaccurate.
      placeholder: Detail the text, requirement, or diagram needing updates.
    validations:
      required: true
  - type: textarea
    id: suggested-content
    attributes:
      label: Suggested Content
      description: Replacement or additional markdown text.
      render: markdown
    validations:
      required: false
